name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: tabdisplay
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; else export VERSION_NAME="0.0.0-${GITHUB_SHA::7}"; fi
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/TabDisplay-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*

  mac:
    needs: apk                      # the APK is bundled into TabDisplay.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Build TabDisplay.app (bundles adb + APK)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION="${GITHUB_REF_NAME#v}"; else export VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          export APK_PATH="$(ls apk/*.apk | head -1)"
          mac/build.sh
          mkdir -p dist
          ditto -c -k --keepParent mac/build/TabDisplay.app "dist/TabDisplay-${VERSION}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [apk, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
