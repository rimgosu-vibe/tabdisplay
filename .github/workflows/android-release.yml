name: android-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: tabdisplay
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; else export VERSION_NAME="0.0.0-${GITHUB_SHA::7}"; fi
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/TabDisplay-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TabDisplay-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
